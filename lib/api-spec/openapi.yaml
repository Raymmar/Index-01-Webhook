openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /settings:
    get:
      operationId: getSettings
      responses:
        "200":
          description: Current account and app settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
    patch:
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsUpdate" }
      responses:
        "200":
          description: Saved settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
  /organizer:
    get:
      operationId: getOrganizer
      responses:
        "200":
          description: Independent child actions and source-message processing states
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organizer" }
  /events/{id}/understand:
    post:
      operationId: understandEvent
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "202":
          description: Queued or already processed
  /items:
    post:
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionItem" }
  /items/{id}/pin:
    delete:
      operationId: unpinItem
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, minLength: 1 } }
      responses:
        "200":
          description: Unpinned task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionItem" }
    post:
      operationId: pinItem
      summary: Pin or refresh pin priority using server-owned recency
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, minLength: 1 } }
      responses:
        "200":
          description: Pinned task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionItem" }
        "404":
          description: Active task not found in your account
  /items/{id}:
    patch:
      operationId: updateItem
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionItem" }
    delete:
      operationId: deleteItem
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Deleted action item; original note unchanged
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /webhooks:
    get:
      operationId: listWebhooks
      responses:
        "200":
          description: Your endpoints
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Webhook" }
    post:
      operationId: createWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookInput" }
      responses:
        "201":
          description: Created with one-time secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookCredentials" }
  /webhooks/{id}/rotate:
    post:
      operationId: rotateWebhook
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Rotated credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookCredentials" }
  /webhooks/{id}:
    delete:
      operationId: revokeWebhook
      summary: Permanently revoke a webhook without deleting received events
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, minLength: 1 } }
      responses:
        "204":
          description: Revoked; future deliveries and token rotation are rejected
        "401":
          description: Sign in required
        "404":
          description: Webhook not found in your account
  /events:
    get:
      operationId: listEvents
      parameters:
        - { name: before, in: query, schema: { type: string } }
        - { name: view, in: query, schema: { type: string, enum: [all, notes] } }
        - { name: pageSize, in: query, description: "Maximum messages per page; defaults to 50 for existing callers", schema: { type: integer, minimum: 1, maximum: 50 } }
      responses:
        "200":
          description: Latest received events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventPage" }
        "400":
          description: Invalid page size or cursor
  /events/stream:
    get:
      operationId: streamEvents
      summary: Account-scoped live inbox notifications
      description: Cookie-authenticated SSE. Ready requests an initial catch-up; inbox-changed invalidates the inbox after a committed delivery. Native EventSource handles reconnects.
      responses:
        "200":
          description: Server-sent events named ready and inbox-changed, plus keepalive comments.
          content:
            text/event-stream:
              schema: { type: string }
        "401":
          description: Sign in required
  /events/{id}:
    delete:
      operationId: deleteEvent
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, minLength: 1 } }
      responses:
        "204":
          description: Soft-deleted original message; derived objects retained
    get:
      operationId: getEvent
      summary: Get an original message in the signed-in account
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Original message and private recording URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxEvent" }
        "401":
          description: Sign in required
        "404":
          description: Message not found in your account
  /events/{id}/audio:
    get:
      operationId: getEventAudio
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Private audio
          content:
            audio/mp4:
              schema: { type: string, format: binary }
  /receive/{id}:
    post:
      operationId: receiveWebhook
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      security: [{ webhookToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClickPayload" }
          multipart/form-data:
            schema: { $ref: "#/components/schemas/RecordingPayload" }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
components:
  securitySchemes:
    webhookToken: { type: http, scheme: bearer }
  schemas:
    Settings:
      type: object
      required: [isOwner, allowed, allowSignups, timezone, aiProvider, aiModel, directKeyConfigured, managedConfigured, availableModels]
      properties:
        isOwner: { type: boolean }
        allowed: { type: boolean }
        allowSignups: { type: boolean }
        timezone: { type: [string, "null"] }
        aiProvider: { type: string, enum: [replit, openai] }
        aiModel: { type: string }
        directKeyConfigured: { type: boolean }
        managedConfigured: { type: boolean }
        availableModels:
          type: array
          items: { type: string }
    SettingsUpdate:
      type: object
      properties:
        timezone: { type: string, minLength: 1, maxLength: 100 }
        allowSignups: { type: boolean }
        aiProvider: { type: string, enum: [replit, openai] }
        aiModel: { type: string, minLength: 1, maxLength: 100 }
    ActionItem:
      type: object
      required: [id, sourceEventId, kind, title, dueAt, timezone, status, needsReview, originalTimeText, createdAt, pinnedAt]
      properties:
        id: { type: string }
        sourceEventId: { type: string, description: Original inbox message shared by independently identified child actions }
        sourceDeleted: { type: boolean }
        kind: { type: string, enum: [task] }
        title: { type: string }
        dueAt: { type: [string, "null"] }
        timezone: { type: string }
        status: { type: string, enum: [open, completed, dismissed] }
        needsReview: { type: boolean }
        originalTimeText: { type: [string, "null"] }
        pinnedAt: { type: [string, "null"], description: Server-owned pin recency }
        createdAt: { type: string }
    ItemInput:
      type: object
      required: [title]
      properties:
        kind: { type: string, enum: [task, reminder], deprecated: true, description: Accepted for older clients; all actions are tasks with optional due dates }
        title: { type: string, minLength: 1, maxLength: 500 }
        dueAt: { type: [string, "null"] }
    ItemUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        dueAt: { type: [string, "null"] }
        status: { type: string, enum: [open, completed, dismissed] }
        needsReview: { type: boolean }
    ProcessingJob:
      type: object
      required: [eventId, status, error]
      properties:
        eventId: { type: string }
        status: { type: string, enum: [pending, processing, completed, failed] }
        error: { type: [string, "null"] }
    Organizer:
      type: object
      required: [items, jobs, messageCount]
      properties:
        messageCount: { type: integer, minimum: 0 }
        items:
          type: array
          items: { $ref: "#/components/schemas/ActionItem" }
        jobs:
          type: array
          items: { $ref: "#/components/schemas/ProcessingJob" }
    WebhookInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
    Webhook:
      type: object
      required: [id, name, path, createdAt, eventCount, lastReceivedAt]
      properties:
        id: { type: string }
        name: { type: string }
        path: { type: string }
        createdAt: { type: string }
        eventCount: { type: integer }
        lastReceivedAt: { type: [string, "null"] }
    WebhookCredentials:
      type: object
      required: [webhook, headerName, headerValue]
      properties:
        webhook: { $ref: "#/components/schemas/Webhook" }
        headerName: { type: string }
        headerValue: { type: string }
    InboxEvent:
      type: object
      required: [id, webhookId, webhookName, receivedAt, recordedAt, kind, transcription, audioUrl, audioSize, payload]
      properties:
        deletedAt: { type: [string, "null"] }
        id: { type: string }
        webhookId: { type: [string, "null"] }
        webhookName: { type: string }
        receivedAt: { type: string }
        recordedAt: { type: [string, "null"] }
        kind: { type: string, enum: [recording, json] }
        transcription: { type: [string, "null"] }
        audioUrl: { type: [string, "null"] }
        audioSize: { type: [integer, "null"] }
        payload: { type: object, additionalProperties: true }
    EventPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/InboxEvent" }
        nextCursor: { type: [string, "null"] }
    ClickPayload:
      type: object
      additionalProperties: true
    RecordingPayload:
      type: object
      properties:
        audio: { type: string, format: binary }
        transcription: { type: string }
        recordedAt: { type: string }
        client: { type: string }
    Receipt:
      type: object
      required: [id, received]
      properties:
        id: { type: string }
        received: { type: boolean }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

